name: Verificar túnel público Sites ADS
on:
  push:
    branches:
      - ander-flow/v1
    paths:
      - .github/workflows/verificar-tunel-estavel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Testar HTTPS de fora do computador do usuário
        env:
          URL_TUNEL: https://wise-oak-d24294b5.tunnl.gg
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.URL_TUNEL;
          const options={signal:AbortSignal.timeout(18000),
            headers:{'tunnl-skip-browser-warning':'1','cache-control':'no-cache'}};
          const health=await fetch(base+'/api/saude',options);
          assert.equal(health.status,200,'Saúde pública HTTP '+health.status);
          assert.deepEqual(await health.json(),{estado:'ok'});
          const home=await fetch(base+'/',options);
          assert.equal(home.status,200,'Home pública HTTP '+home.status);
          const html=await home.text();
          assert.match(html,/Ferramentas do Ander/, 'Não carregou o portal Sites ADS');
          // O navegador de visitantes pode ver o aviso anti-phishing,
          // mas a API responde diretamente para verificadores automatizados.
          const signup=await fetch(base+'/criar-conta.html',options);
          assert.equal(signup.status,200);
          assert.match(await signup.text(),/form-criar/);
          const sessao=await fetch(base+'/api/autenticacao/sessao',options);
          assert.equal(sessao.status,200);
          assert.equal((await sessao.json()).usuario,null);
          const protegido=await fetch(base+'/api/premium/operacoes-avancadas/descontos-progressivos-lote',{
            method:'POST',headers:{
              'tunnl-skip-browser-warning':'1','content-type':'application/json'
            },
            body:JSON.stringify({csv:'dados_falsos'}),signal:AbortSignal.timeout(15000)
          });
          assert.equal(protegido.status,403,'Premium sem sessão não deve estar aberto');
          const gist=await fetch('https://api.github.com/gists/a888f4b63bc461e46552e3b651f1102e',
            {signal:AbortSignal.timeout(15000)});
          assert.equal(gist.status,200);
          const registrado=JSON.parse((await gist.json()).files['endereco-teste.json'].content);
          assert.equal(registrado.url,base,'O link fixo deve apontar para o túnel novo');
          console.log('TUNEL_PUBLICO_EXTERNO_OK '+base);
          NODE
