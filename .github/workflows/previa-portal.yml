name: Publicar prévia do portal

on:
  push:
    branches: [ander-flow/v1]
    paths:
      - 'portal/**'
      - 'index.html'
      - '.github/workflows/previa-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix portal --ignore-scripts
      - name: Instalar formatadores fixados apenas para compilação
        run: npm install --prefix portal --no-save --no-package-lock --ignore-scripts prettier@3.9.10 sql-formatter@15.9.0 esbuild@0.25.12 mermaid@11.17.2 playwright@1.62.0
      - name: Empacotar motores locais de formatação
        run: npm run montar:formatadores --prefix portal
      - name: Empacotar Mermaid local para os diagramas
        run: npm run montar:diagramas --prefix portal
      - name: Gerar URLs públicas da prévia
        run: npm run gerar --prefix portal
        env:
          PORTAL_URL_SITE: 'https://anderhonorato.github.io/Site-de-Renda-Passiva/portal/'
      - name: Validar toda a suíte de código
        run: npm run testar --prefix portal
      - name: Validar fluxos de cadastro, conta, chat e administração da API
        run: npm run testar:api --prefix portal
      - name: Conferir integridade do catálogo e das páginas
        run: npm run verificar --prefix portal
      - name: Instalar Chromium para validar uploads e relatórios
        run: portal/node_modules/.bin/playwright install --with-deps chromium
      - name: Validar ferramentas profissionais no navegador com API real
        run: node --test --test-concurrency=1 portal/testes/navegador/profissionais.teste.mjs
      - run: node --test portal/testes/previa-pages.test.mjs portal/testes/publicação-e-servidor.test.mjs portal/testes/indexacao-pages.test.mjs
      - run: node portal/ferramentas/preparar-pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: portal/.execucao/pages
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
