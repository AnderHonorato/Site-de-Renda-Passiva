name: Validar Ander Flow (API e segurança)

on:
  push:
    branches: [ander-flow/v1]
    paths:
      - 'ander-flow/**'
      - '.github/workflows/validar-ander-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-ander-flow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ander-flow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ander-flow/package-lock.json
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Validar estrutura, idiomas e textos
        run: npm run verificar
      - name: Validar propriedade dos módulos
        run: npm run verificar:propriedade
      - name: Executar testes de unidade e integração
        run: npm run testar
