<!doctype html>
<html>
<head>
  <!-- incluir: compartilhado-cabeca -->
  <meta name="af-rota" content="/termos">
  <meta name="af-acesso" content="publico">
  <title data-texto="termos.titulo_pagina"></title>
  <meta name="description" data-texto-content="termos.descricao_pagina">
  <link rel="stylesheet" href="/estatico/paginas/termos/termos.css">
</head>
<body>
  <!-- incluir: compartilhado-cabecalho -->

  <main id="conteudo" class="conteudo pagina-legal termos">
    <header class="pagina-legal__cabecalho">
      <p class="sobretitulo" data-texto="termos.sobretitulo"></p>
      <h1 class="titulo-display titulo-display--2" data-texto="termos.titulo"></h1>
      <p class="texto-2 pagina-legal__intro" data-texto="termos.intro"></p>
    </header>

    <nav class="pagina-legal__indice" data-texto-aria-label="termos.indice.titulo">
      <a href="#servico" data-texto="termos.indice.servico"></a>
      <a href="#conta" data-texto="termos.indice.conta"></a>
      <a href="#uso" data-texto="termos.indice.uso"></a>
      <a href="#planos" data-texto="termos.indice.planos"></a>
      <a href="#calculos" data-texto="termos.indice.calculos"></a>
      <a href="#disponibilidade" data-texto="termos.indice.disponibilidade"></a>
      <a href="#encerramento" data-texto="termos.indice.encerramento"></a>
      <a href="#mudancas" data-texto="termos.indice.mudancas"></a>
    </nav>

    <section class="pagina-legal__secao" id="servico">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.servico.titulo"></h2>
      <p class="texto-2" data-texto="termos.servico.texto"></p>
    </section>

    <section class="pagina-legal__secao" id="conta">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.conta.titulo"></h2>
      <p class="texto-2" data-texto="termos.conta.texto"></p>
    </section>

    <section class="pagina-legal__secao" id="uso">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.uso.titulo"></h2>
      <p class="texto-2" data-texto="termos.uso.texto"></p>
      <ul class="pagina-legal__lista">
        <li data-texto="termos.uso.itens.abuso"></li>
        <li data-texto="termos.uso.itens.limite"></li>
        <li data-texto="termos.uso.itens.terceiros"></li>
      </ul>
    </section>

    <section class="pagina-legal__secao" id="planos">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.planos.titulo"></h2>
      <p class="texto-2" data-texto="termos.planos.texto"></p>
      <p class="texto-2" data-texto="termos.planos.pagamento"></p>
      <a class="pagina-legal__link" href="/planos" data-texto="termos.planos.link"></a>
    </section>

    <section class="pagina-legal__secao" id="calculos">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.calculos.titulo"></h2>
      <p class="texto-2" data-texto="termos.calculos.texto"></p>
    </section>

    <section class="pagina-legal__secao" id="disponibilidade">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.disponibilidade.titulo"></h2>
      <p class="texto-2" data-texto="termos.disponibilidade.texto"></p>
    </section>

    <section class="pagina-legal__secao" id="encerramento">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.encerramento.titulo"></h2>
      <p class="texto-2" data-texto="termos.encerramento.texto"></p>
      <a class="botao botao--primario" href="/conta" data-texto="termos.encerramento.acao"></a>
    </section>

    <section class="pagina-legal__secao" id="mudancas">
      <h2 class="titulo-display titulo-display--4" data-texto="termos.mudancas.titulo"></h2>
      <p class="texto-2" data-texto="termos.mudancas.texto"></p>
    </section>
  </main>

  <!-- incluir: compartilhado-rodape -->
  <!-- incluir: compartilhado-navegacao-celular -->
</body>
</html>
