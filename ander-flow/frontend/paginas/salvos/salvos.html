<!doctype html>
<html>
<head>
  <!-- incluir: compartilhado-cabeca -->
  <meta name="af-rota" content="/salvos">
  <meta name="af-acesso" content="publico">
  <title data-texto="salvos.titulo_pagina"></title>
  <meta name="description" data-texto-content="salvos.descricao_pagina">
  <link rel="stylesheet" href="/estatico/paginas/salvos/salvos.css">
  <script type="module" src="/estatico/paginas/salvos/salvos.js"></script>
</head>
<body>
  <!-- incluir: compartilhado-cabecalho -->

  <main id="conteudo" class="conteudo salvos">
    <header class="salvos__cabecalho">
      <h1 class="titulo-display titulo-display--3" data-texto="salvos.titulo"></h1>
      <p class="texto-2 salvos__resumo"></p>
    </header>

    <div class="superficie superficie--tinta salvos__juntar" hidden>
      <p class="salvos__juntar-titulo" data-texto="salvos.juntar.titulo"></p>
      <p class="salvos__juntar-texto"></p>
      <div class="salvos__juntar-acoes">
        <button type="button" class="botao botao--primario botao--pequeno salvos__juntar-confirmar" data-texto="salvos.juntar.confirmar"></button>
        <button type="button" class="botao botao--fantasma botao--pequeno salvos__juntar-ignorar" data-texto="compartilhado.acoes.agora_nao"></button>
      </div>
    </div>

    <div class="estado estado--carregando salvos__carregando">
      <p class="estado__titulo" data-texto="compartilhado.estados.carregando"></p>
    </div>

    <ul class="lista-densa salvos__lista" hidden></ul>

    <div class="estado estado--vazio salvos__vazio" hidden>
      <svg class="icone estado__icone" aria-hidden="true"><use href="/estatico/compartilhado/compartilhado-icones.svg#icone-estrela"></use></svg>
      <p class="estado__titulo" data-texto="salvos.vazio.titulo"></p>
      <p class="estado__texto salvos__vazio-texto"></p>
      <a class="botao botao--secundario estado__acao" href="/ferramentas" data-texto="compartilhado.acoes.ir_para_catalogo"></a>
    </div>

    <div class="estado estado--erro salvos__erro" hidden>
      <p class="estado__titulo" data-texto="compartilhado.estados.erro_titulo"></p>
      <p class="estado__texto" data-texto="compartilhado.estados.erro_texto"></p>
      <button type="button" class="botao botao--secundario estado__acao salvos__recarregar" data-texto="compartilhado.acoes.tentar_de_novo"></button>
    </div>
  </main>

  <!-- incluir: compartilhado-rodape -->
  <!-- incluir: compartilhado-navegacao-celular -->
</body>
</html>
