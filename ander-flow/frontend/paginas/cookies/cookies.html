<!doctype html>
<html>
<head>
  <!-- incluir: compartilhado-cabeca -->
  <meta name="af-rota" content="/cookies">
  <meta name="af-acesso" content="publico">
  <title data-texto="cookies.titulo_pagina"></title>
  <meta name="description" data-texto-content="cookies.descricao_pagina">
  <link rel="stylesheet" href="/estatico/paginas/cookies/cookies.css">
</head>
<body>
  <!-- incluir: compartilhado-cabecalho -->

  <main id="conteudo" class="conteudo pagina-legal cookies">
    <header class="pagina-legal__cabecalho">
      <p class="sobretitulo" data-texto="cookies.sobretitulo"></p>
      <h1 class="titulo-display titulo-display--2" data-texto="cookies.titulo"></h1>
      <p class="texto-2 pagina-legal__intro" data-texto="cookies.intro"></p>
    </header>

    <section class="pagina-legal__secao">
      <h2 class="titulo-display titulo-display--4" data-texto="cookies.usados.titulo"></h2>
      <table class="tabela cookies__tabela">
        <thead>
          <tr>
            <th data-texto="cookies.usados.coluna_nome"></th>
            <th data-texto="cookies.usados.coluna_para_que"></th>
            <th data-texto="cookies.usados.coluna_duracao"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code data-texto="cookies.usados.af_sessao.nome"></code></td>
            <td data-texto="cookies.usados.af_sessao.para_que"></td>
            <td data-texto="cookies.usados.af_sessao.duracao"></td>
          </tr>
          <tr>
            <td><code data-texto="cookies.usados.af_csrf.nome"></code></td>
            <td data-texto="cookies.usados.af_csrf.para_que"></td>
            <td data-texto="cookies.usados.af_csrf.duracao"></td>
          </tr>
          <tr>
            <td><code data-texto="cookies.usados.idioma.nome"></code></td>
            <td data-texto="cookies.usados.idioma.para_que"></td>
            <td data-texto="cookies.usados.idioma.duracao"></td>
          </tr>
          <tr>
            <td><code data-texto="cookies.usados.tema.nome"></code></td>
            <td data-texto="cookies.usados.tema.para_que"></td>
            <td data-texto="cookies.usados.tema.duracao"></td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="pagina-legal__secao">
      <h2 class="titulo-display titulo-display--4" data-texto="cookies.armazenamento.titulo"></h2>
      <p class="texto-2" data-texto="cookies.armazenamento.texto"></p>
      <ul class="pagina-legal__lista pagina-legal__lista--codigo">
        <li><code data-texto="cookies.armazenamento.chaves.tema"></code></li>
        <li><code data-texto="cookies.armazenamento.chaves.idioma"></code></li>
        <li><code data-texto="cookies.armazenamento.chaves.salvos"></code></li>
        <li><code data-texto="cookies.armazenamento.chaves.recentes"></code></li>
        <li><code data-texto="cookies.armazenamento.chaves.primeira_visita"></code></li>
        <li><code data-texto="cookies.armazenamento.chaves.popup"></code></li>
        <li><code data-texto="cookies.armazenamento.chaves.rascunho"></code></li>
      </ul>
    </section>

    <section class="pagina-legal__secao">
      <h2 class="titulo-display titulo-display--4" data-texto="cookies.terceiros.titulo"></h2>
      <p class="texto-2" data-texto="cookies.terceiros.texto"></p>
    </section>

    <section class="pagina-legal__secao">
      <h2 class="titulo-display titulo-display--4" data-texto="cookies.gerenciar.titulo"></h2>
      <p class="texto-2" data-texto="cookies.gerenciar.texto"></p>
      <p class="texto-2" data-texto="cookies.gerenciar.consequencia"></p>
    </section>
  </main>

  <!-- incluir: compartilhado-rodape -->
  <!-- incluir: compartilhado-navegacao-celular -->
</body>
</html>
