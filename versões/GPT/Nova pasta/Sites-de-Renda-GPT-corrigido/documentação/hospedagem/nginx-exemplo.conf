# Exemplo Nginx — perfil SEM anúncios, para um produto publicado em /confeitaria/.
# Ajuste server_name, caminhos e certificados. Arquivos gravados em UTF-8 (NFC).

server {
    listen 443 ssl http2;
    server_name SEU-DOMINIO.exemplo;
    charset utf-8;

    # ssl_certificate     /caminho/fullchain.pem;
    # ssl_certificate_key /caminho/privkey.pem;

    location /confeitaria/ {
        alias /var/www/confeitaria/publicacao/;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /confeitaria/p%C3%A1ginas/p%C3%A1gina-n%C3%A3o-encontrada.html;

        types { text/javascript js mjs; application/json json; image/svg+xml svg; font/woff2 woff2; }

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Ative somente após confirmar HTTPS em todo o domínio:
        # add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Bloqueia arquivos ocultos por segurança.
    location ~ /\. { deny all; }
}
