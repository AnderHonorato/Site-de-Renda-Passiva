<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">Dois servidores com um cabo solto soltando faíscas</title>
  <style>
    :root { --tinta: #1a1a1a; --sombra: #1a1a1a; --sombra-alfa: .07; }
    [stroke="#1a1a1a"] { stroke: var(--tinta); }
    [fill="#1a1a1a"] { fill: var(--tinta); }
    ellipse[opacity] { fill: var(--sombra); opacity: var(--sombra-alfa); }
    .faísca { animation: faiscar 1.1s steps(1, end) infinite; }
    @keyframes faiscar { 0%, 100% { opacity: 1; } 45% { opacity: 0; } 60% { opacity: 1; } 75% { opacity: 0; } }
    .luz { animation: piscar 1.8s ease-in-out infinite; }
    @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .cabo { animation: balançar 2.6s ease-in-out infinite; transform-origin: 252px 160px; }
    @keyframes balançar { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .faísca, .luz, .cabo { animation: none; } }
  </style>
  <ellipse cx="150" cy="214" rx="104" ry="11" fill="#1a1a1a" opacity=".07"/>
  <rect x="62" y="52" width="176" height="56" rx="16" fill="#3d4451" stroke="#1a1a1a" stroke-width="3"/>
  <circle class="luz" cx="90" cy="80" r="6" fill="#d97757"/>
  <rect x="112" y="75" width="86" height="10" rx="5" fill="#6b7280"/>
  <rect x="62" y="120" width="176" height="56" rx="16" fill="#3d4451" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="90" cy="148" r="6" fill="#c9b89b"/>
  <rect x="112" y="143" width="62" height="10" rx="5" fill="#6b7280"/>
  <g class="cabo" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round">
    <path d="M238 148h10c14 0 20 6 20 18v18"/>
    <rect x="260" y="184" width="16" height="14" rx="3" fill="#c9b89b" stroke-width="3"/>
  </g>
  <g class="faísca" fill="none" stroke="#d97757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M264 202l7-9-6-2 8-10"/>
    <path d="M250 196l-6-4 8-3"/>
    <path d="M286 192l8-4"/>
  </g>
</svg>
