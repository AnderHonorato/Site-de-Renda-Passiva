<svg xmlns="http://www.w3.org/2000/svg" viewBox="122 0 300 200" role="img" aria-labelledby="t">
  <title id="t">Uma lista de tarefas sendo marcada item por item</title>
  <style>
    :root { --tinta: #1a1a1a; --fundo: #e3e6ec; --sombra: #1a1a1a; --sombra-alfa: .08; }
    [stroke="#1a1a1a"] { stroke: var(--tinta); }
    [fill="#1a1a1a"] { fill: var(--tinta); }
    .fundo { fill: var(--fundo); }
    ellipse.chão { fill: var(--sombra); opacity: var(--sombra-alfa); }
    .o { transform-box: fill-box; transform-origin: center; }
    .b { transform-box: fill-box; transform-origin: bottom; }
    .e { transform-box: fill-box; transform-origin: left; }
    .visto { stroke-dasharray: 34; animation: marca 6.4s ease-in-out infinite; }
    .v2 { animation-delay: .8s; } .v3 { animation-delay: 1.6s; } .v4 { animation-delay: 2.4s; }
    @keyframes marca { 0%, 8% { stroke-dashoffset: 34; } 20%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 34; } }
    .risco { animation: riscar 6.4s ease-in-out infinite; }
    .r2 { animation-delay: .8s; } .r3 { animation-delay: 1.6s; } .r4 { animation-delay: 2.4s; }
    @keyframes riscar { 0%, 8% { transform: scaleX(0); } 22%, 88% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .estrela { animation: gira 4s ease-in-out infinite; }
    @keyframes gira { 0%, 100% { transform: rotate(-14deg) scale(1); } 50% { transform: rotate(14deg) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
