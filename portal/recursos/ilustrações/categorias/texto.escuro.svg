<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="t">
  <title id="t">Um documento sendo digitado linha por linha, com o cursor piscando</title>
  <style>
    :root { --tinta: #1a1a1a; --fundo: #e3e6ec; --sombra: #1a1a1a; --sombra-alfa: .08; }
    :root { --tinta: #e9e4dc; --fundo: #23272d; --sombra: #000; --sombra-alfa: .4; }
    [stroke="#1a1a1a"] { stroke: var(--tinta); }
    [fill="#1a1a1a"] { fill: var(--tinta); }
    .fundo { fill: var(--fundo); }
    ellipse.chão { fill: var(--sombra); opacity: var(--sombra-alfa); }
    .o { transform-box: fill-box; transform-origin: center; }
    .b { transform-box: fill-box; transform-origin: bottom; }
    .e { transform-box: fill-box; transform-origin: left; }
    .linha { animation: digita 5.6s ease-in-out infinite; }
    .l2 { animation-delay: .5s; } .l3 { animation-delay: 1s; } .l4 { animation-delay: 1.5s; }
    @keyframes digita { 0% { transform: scaleX(0); } 25%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .cursor { animation: pisca 1s steps(1, end) infinite; }
    @keyframes pisca { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .letra { animation: pulsa 3s ease-in-out infinite; }
    @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="fundo" width="480" height="200"/>
  <ellipse class="chão" cx="240" cy="180" rx="140" ry="9"/>
  <rect x="120" y="28" width="230" height="146" rx="16" fill="#fffdf9" stroke="#1a1a1a" stroke-width="3"/>
  <rect class="linha e l1" x="142" y="52" width="186" height="10" rx="5" fill="#3d4451"/>
  <rect class="linha e l2" x="142" y="76" width="150" height="10" rx="5" fill="#c9b89b"/>
  <rect class="linha e l3" x="142" y="100" width="176" height="10" rx="5" fill="#c9b89b"/>
  <rect class="linha e l4" x="142" y="124" width="104" height="10" rx="5" fill="#c9b89b"/>
  <rect class="cursor" x="252" y="119" width="4" height="20" rx="2" fill="#d97757"/>
  <g class="letra o"><circle cx="396" cy="94" r="40" fill="#d97757" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M378 118l18-48 18 48M385 102h22" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
