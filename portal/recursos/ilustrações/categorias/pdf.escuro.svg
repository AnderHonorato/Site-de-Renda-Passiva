<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="t"><title id="t">Uma tesoura cortando uma página de PDF ao meio, com a etiqueta PDF no canto</title><style> :root { --tinta: #e9e4dc; --fundo: #292623; --sombra: #000; --sombra-alfa: .4; } [stroke="#1a1a1a"] { stroke: var(--tinta); } [fill="#1a1a1a"] { fill: var(--tinta); } .fundo { fill: var(--fundo); } ellipse.chão { fill: var(--sombra); opacity: var(--sombra-alfa); } .o { transform-box: fill-box; transform-origin: center; } .t { transform-box: fill-box; transform-origin: 50% 0; } .tesoura { animation: corta 4.4s ease-in-out infinite; } @keyframes corta { 0%, 8% { transform: translateX(0); } 52%, 100% { transform: translateX(132px); } } .l1 { transform-origin: 0 0; animation: snipa .55s ease-in-out infinite alternate; } .l2 { transform-origin: 0 0; animation: snipb .55s ease-in-out infinite alternate; } @keyframes snipa { from { transform: rotate(-11deg); } to { transform: rotate(1deg); } } @keyframes snipb { from { transform: rotate(11deg); } to { transform: rotate(-1deg); } } .baixo { animation: cai 4.4s ease-in-out infinite; } @keyframes cai { 0%, 52% { transform: translate(0, 0) rotate(0deg); } 66%, 88% { transform: translate(8px, 14px) rotate(5deg); } 100% { transform: translate(0, 0) rotate(0deg); } } .etiqueta { animation: balança 4.4s ease-in-out infinite; } @keyframes balança { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } } .risco { stroke-dasharray: 7 7; animation: marcha 1.2s linear infinite; } @keyframes marcha { to { stroke-dashoffset: -14; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
