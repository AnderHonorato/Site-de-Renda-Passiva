<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">Uma folha com um espaço vazio e uma lupa procurando</title>
  <style>
    :root { --tinta: #1a1a1a; --sombra: #1a1a1a; --sombra-alfa: .07; }
    @media (prefers-color-scheme: dark) { :root { --tinta: #e9e4dc; --sombra: #000; --sombra-alfa: .4; } }
    [stroke="#1a1a1a"] { stroke: var(--tinta); }
    [fill="#1a1a1a"] { fill: var(--tinta); }
    ellipse[opacity] { fill: var(--sombra); opacity: var(--sombra-alfa); }
    @media (prefers-color-scheme: dark) { [stroke="#3d4451"] { stroke: #9aa3b2; } circle[fill="#3d4451"] { fill: #9aa3b2; } }
    .lupa { animation: procurar 4s ease-in-out infinite; transform-origin: 214px 126px; }
    @keyframes procurar { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-30px, 14px) rotate(-10deg); } }
    .ponto { animation: pulsar 1.6s ease-in-out infinite; }
    .ponto:nth-of-type(2) { animation-delay: .25s; }
    .ponto:nth-of-type(3) { animation-delay: .5s; }
    @keyframes pulsar { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .lupa, .ponto { animation: none; } }
  </style>
  <ellipse cx="160" cy="214" rx="104" ry="11" fill="#1a1a1a" opacity=".07"/>
  <rect x="84" y="30" width="136" height="172" rx="16" fill="#fffdf9" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="106" y="56" width="92" height="9" rx="4.5" fill="#ddd6cc"/>
  <rect x="106" y="78" width="64" height="9" rx="4.5" fill="#ddd6cc"/>
  <rect x="106" y="100" width="80" height="9" rx="4.5" fill="#ddd6cc"/>
  <rect x="106" y="126" width="92" height="56" rx="12" fill="#f6e3da" stroke="#d97757" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M143 148c0-8 6-12 13-12s13 4 13 11c0 9-13 9-13 19" fill="none" stroke="#a8472a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="156" cy="173" r="3.4" fill="#a8472a"/>
  <g class="lupa">
    <line x1="233" y1="145" x2="262" y2="176" stroke="#3d4451" stroke-width="10" stroke-linecap="round"/>
    <circle cx="214" cy="126" r="28" fill="#fffdf9" fill-opacity=".7" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M199 118a17 17 0 0 1 12-9" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  </g>
  <g fill="#d97757"><circle class="ponto" cx="248" cy="62" r="4"/><circle class="ponto" cx="262" cy="62" r="4"/><circle class="ponto" cx="276" cy="62" r="4"/></g>
</svg>
