<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 0 300 200" role="img" aria-labelledby="t">
  <title id="t">Uma planilha com células acendendo em onda</title>
  <style>
    :root { --tinta: #1a1a1a; --fundo: #ece5d8; --sombra: #1a1a1a; --sombra-alfa: .08; }
    [stroke="#1a1a1a"] { stroke: var(--tinta); }
    [fill="#1a1a1a"] { fill: var(--tinta); }
    .fundo { fill: var(--fundo); }
    ellipse.chão { fill: var(--sombra); opacity: var(--sombra-alfa); }
    .o { transform-box: fill-box; transform-origin: center; }
    .b { transform-box: fill-box; transform-origin: bottom; }
    .e { transform-box: fill-box; transform-origin: left; }
    .cel { animation: onda 4.8s ease-in-out infinite; opacity: .12; }
    .c1 { animation-delay: 0s; } .c2 { animation-delay: .35s; } .c3 { animation-delay: .7s; } .c4 { animation-delay: 1.05s; } .c5 { animation-delay: 1.4s; } .c6 { animation-delay: 1.75s; }
    @keyframes onda { 0%, 100% { opacity: .12; } 25%, 45% { opacity: .85; } }
    .barra { animation: sobe 4.8s ease-in-out infinite; }
    @keyframes sobe { 0%, 100% { transform: scaleY(.4); } 40% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
