<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 0 300 200" role="img" aria-labelledby="t">
  <title id="t">Barras de lucro crescendo ao lado de uma moeda girando</title>
  <style>
    :root { --tinta: #1a1a1a; --fundo: #f6e3da; --sombra: #1a1a1a; --sombra-alfa: .08; }
    [stroke="#1a1a1a"] { stroke: var(--tinta); }
    [fill="#1a1a1a"] { fill: var(--tinta); }
    .fundo { fill: var(--fundo); }
    ellipse.chão { fill: var(--sombra); opacity: var(--sombra-alfa); }
    .o { transform-box: fill-box; transform-origin: center; }
    .b { transform-box: fill-box; transform-origin: bottom; }
    .e { transform-box: fill-box; transform-origin: left; }
    .barra { animation: cresce 4s ease-in-out infinite; }
    .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; }
    @keyframes cresce { 0%, 100% { transform: scaleY(.3); } 45%, 75% { transform: scaleY(1); } }
    .moeda { animation: gira 3.2s ease-in-out infinite; }
    @keyframes gira { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.12); } }
    .pula { animation: pula 2s ease-in-out infinite; }
    @keyframes pula { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="fundo" width="480" height="200"/>
  <ellipse class="chão" cx="240" cy="176" rx="140" ry="9"/>
  <rect class="barra b b1" x="128" y="118" width="32" height="46" rx="7" fill="#3d4451" stroke="#1a1a1a" stroke-width="3"/>
  <rect class="barra b b2" x="172" y="94" width="32" height="70" rx="7" fill="#c9b89b" stroke="#1a1a1a" stroke-width="3"/>
  <rect class="barra b b3" x="216" y="62" width="32" height="102" rx="7" fill="#d97757" stroke="#1a1a1a" stroke-width="3"/>
  <g class="moeda o"><circle cx="320" cy="94" r="38" fill="#c9b89b" stroke="#1a1a1a" stroke-width="3"/><circle cx="320" cy="94" r="28" fill="none" stroke="#1a1a1a" stroke-width="2.5" opacity=".45"/>
    <path d="M330 84q-9-7-18 0q-7 7 3 11q11 4 15 9q6 7-2 13q-9 6-18-1" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/></g>
  <g class="pula o"><ellipse cx="388" cy="146" rx="26" ry="9" fill="#c9b89b" stroke="#1a1a1a" stroke-width="3"/></g>
  <ellipse cx="388" cy="156" rx="26" ry="9" fill="#b8a88a" stroke="#1a1a1a" stroke-width="3"/>
  <ellipse cx="388" cy="166" rx="26" ry="9" fill="#c9b89b" stroke="#1a1a1a" stroke-width="3"/>
<style>*{animation:none!important;transition:none!important}</style></svg>
