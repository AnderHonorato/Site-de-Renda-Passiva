<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
  <style>
    #i { fill: none; stroke: #cc6040; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    #i > * { transform-box: fill-box; transform-origin: center; }
    #i > :nth-child(1), #i > :nth-child(2), #i > :nth-child(3), #i > :nth-child(4) { animation: pulsa 2s ease-in-out infinite; }
    #i > :nth-child(2) { animation-delay: .25s; } #i > :nth-child(4) { animation-delay: .5s; } #i > :nth-child(3) { animation-delay: .75s; }
    @keyframes pulsa { 0%, 100% { transform: scale(.78); } 50% { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
